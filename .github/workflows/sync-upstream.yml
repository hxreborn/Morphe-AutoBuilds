name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An issue, not a PR: pushing upstream/main needs a `workflows` scope
      # GITHUB_TOKEN cannot hold, and upstream keeps changing workflow files.
      - name: Report if upstream has new commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/RookieEnough/Morphe-AutoBuilds.git
          git fetch upstream main
          new=$(git rev-list --count HEAD..upstream/main)
          if [ "$new" -eq 0 ]; then
            echo "Up to date with upstream"
            exit 0
          fi
          title="chore: sync upstream ($new new commits)"
          body=$(
            git log --oneline --no-decorate HEAD..upstream/main | head -30
            echo
            echo "https://github.com/RookieEnough/Morphe-AutoBuilds/commits/main"
          )
          # -R is required: gh routes issues on a fork to the parent by default
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "sync upstream"' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
